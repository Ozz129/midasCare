# Integración continua: instala, valida formato, lint, tipos, build y pruebas.
# No despliega nada. La suite e2e con PostgreSQL se ejecuta contra un servicio efímero.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: midas_care
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: midas_care_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U midas_care -d midas_care_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      CI_DATABASE_URL: postgres://midas_care:ci_only_password@localhost:5432/midas_care_test
      # Secreto exclusivo de CI (sin valor fuera de este workflow).
      AUTH_ACCESS_TOKEN_SECRET: ci-only-access-token-secret-not-for-real-use-0123

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

      - name: Aplicar migraciones a la base efímera
        run: pnpm --filter @care/api run db:migrate
        env:
          NODE_ENV: test
          API_PUBLIC_URL: http://localhost:3000
          CORS_ORIGINS: http://localhost:5173
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Pruebas (incluye e2e con PostgreSQL)
        run: pnpm test
        env:
          TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
